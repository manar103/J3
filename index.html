<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Challenge</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #222;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            text-align: left;
            margin-bottom: 20px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .card code {
            display: block;
            background: #222;
            color: #00ff88;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
        }

        .footer {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔢 Number Challenge</h1>

        <p>JavaScript Number Methods & Challenges</p>

        <div class="card">
            <h2>isNaN() Challenge</h2>

            <code>
                isNaN("100.56456")
            </code>
        </div>

        <div class="card">
            <h2>Check the Result</h2>

            <code>
                Open the Console → F12 → Console
            </code>
        </div>

        <div class="footer">
            Thanks 
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
